# The native Blockcraft client: a Rust program with its own window and GPU
# renderer, replacing the webview shell. The TypeScript game stays the source
# of content -- textures and block data are exported to native/assets by
# tools/export-native.ts -- and world generation is ported exactly, so a seed
# makes the same world in both.
[workspace]
resolver = "2"
members = ["game", "worldgen"]

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev.package."*"]
# Dependencies optimised even in debug: an unoptimised GPU and image stack is
# too slow to judge anything by.
opt-level = 2
