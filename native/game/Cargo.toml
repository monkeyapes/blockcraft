[package]
name = "blockcraft-native"
version = "0.4.0"
edition = "2021"
description = "Blockcraft's native client"

[[bin]]
name = "blockcraft-native"
path = "src/main.rs"

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
crossbeam-channel = "0.5"
glam = { version = "0.33", features = ["bytemuck"] }
# PNG only: the atlas is the one image the game reads, and screenshots the one
# it writes. The default feature set pulls in a dozen codecs we never use.
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wgpu = "30"
winit = "0.30"
worldgen = { path = "../worldgen" }
