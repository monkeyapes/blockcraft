# Builds the Windows installer and attaches it to a GitHub release.
#
# Triggered by pushing a version tag:  git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Rust builds from scratch are slow; cache the target directory.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - run: npm ci
      - run: npm test
      - run: npm run desktop:build

      - name: Publish the installer
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          generate_release_notes: true
          body: |
            ## Blockcraft

            Download the installer below and run it.

            Windows SmartScreen will warn you that the publisher is unknown --
            the installer is not code-signed, because a signing certificate
            costs more than this project has. Choose **More info -> Run
            anyway** if you are happy to proceed.

            You can also [play in your browser](../../deployments) with no
            install at all.
